name: Weryfikacja i staging Hostinger

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/hostinger-verify.yml

  deploy:
    name: Wdrożenie test.eattheball.pl
    needs: prepare
    # Zmienna repozytorium; domyślnie wdrażanie pozostaje wyłączone.
    if: >-
      github.event_name != 'pull_request' &&
      vars.HOSTINGER_STAGING_ENABLED == 'true' &&
      github.ref_name == (vars.HOSTINGER_STAGING_BRANCH || 'main')
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: hostinger-staging-deploy
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: etb-${{ github.sha }}
          path: artifacts
      - name: Przesłanie zweryfikowanego wydania i instalacja stagingu
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_]+$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/etb_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/etb_key ~/.ssh/known_hosts
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="$SSH_USER@$SSH_HOST"
          ssh_opts=(-i ~/.ssh/etb_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$target" "mkdir -p apps/etb-staging/incoming/$release_id"
          scp -i ~/.ssh/etb_key -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            artifacts/release.tar.gz artifacts/release.tar.gz.sha256 scripts/deploy-staging.sh \
            "$target:apps/etb-staging/incoming/$release_id/"
          ssh "${ssh_opts[@]}" "$target" "bash apps/etb-staging/incoming/$release_id/deploy-staging.sh $release_id"
